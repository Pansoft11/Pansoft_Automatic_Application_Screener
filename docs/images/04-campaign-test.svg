<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500"><rect width="960" height="500" fill="#f8fafc"/><rect width="960" height="64" fill="#0f6cbd"/><text x="34" y="42" font-family="Segoe UI,Arial" font-size="25" fill="white">Candidate Email Campaign — safe TEST run</text><g font-family="Segoe UI,Arial"><text x="56" y="112" font-size="18" fill="#334155">SendMode</text><rect x="300" y="84" width="560" height="42" rx="6" fill="white" stroke="#94a3b8"/><text x="320" y="112" font-size="18" fill="#111827">TEST</text><text x="56" y="172" font-size="18" fill="#334155">Confirmation</text><rect x="300" y="144" width="560" height="42" rx="6" fill="white" stroke="#94a3b8"/><text x="320" y="172" font-size="16" fill="#94a3b8">Leave blank for TEST</text><text x="56" y="232" font-size="18" fill="#334155">TestRecipient</text><rect x="300" y="204" width="560" height="42" rx="6" fill="white" stroke="#94a3b8"/><text x="320" y="232" font-size="18" fill="#111827">recruiting-test@example.com</text><text x="56" y="292" font-size="18" fill="#334155">TestCandidateEmail</text><rect x="300" y="264" width="560" height="42" rx="6" fill="white" stroke="#94a3b8"/><text x="320" y="292" font-size="18" fill="#111827">candidate-record@example.net</text><rect x="690" y="340" width="170" height="48" rx="7" fill="#0f6cbd"/><text x="775" y="371" font-size="18" fill="white" text-anchor="middle">Run flow</text><rect x="56" y="414" width="804" height="54" rx="8" fill="#dcfce7" stroke="#16a34a"/><text x="76" y="447" font-size="17" fill="#166534">TEST redirects mail internally and writes a campaign key ending in “ - TEST”.</text></g></svg>
