<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640"><rect width="960" height="640" fill="#f8fafc"/><text x="40" y="48" font-family="Segoe UI,Arial" font-size="26" fill="#0f172a">Historical import — paginated and sequential</text><g font-family="Segoe UI,Arial" font-size="17" text-anchor="middle"><g fill="#dbeafe" stroke="#2563eb"><rect x="310" y="78" width="340" height="54" rx="8"/><rect x="310" y="160" width="340" height="54" rx="8"/><rect x="250" y="242" width="460" height="330" rx="12"/></g><text x="480" y="112" fill="#111827">Manually trigger a flow</text><text x="480" y="194" fill="#111827">Initialize NextLink</text><text x="480" y="276" fill="#111827">Do until NextLink is empty</text><rect x="330" y="304" width="300" height="48" rx="7" fill="#e0f2fe" stroke="#0284c7"/><text x="480" y="334" fill="#111827">Get Message Page</text><rect x="330" y="378" width="300" height="118" rx="7" fill="#f3e8ff" stroke="#9333ea"/><text x="480" y="410" fill="#111827">Apply to each — concurrency 1</text><text x="480" y="442" fill="#111827">ProcessApplicant → UpsertApplicant</text><text x="480" y="474" fill="#111827">Catch → ProcessingLog</text><rect x="330" y="514" width="300" height="42" rx="7" fill="#fae8ff" stroke="#c026d3"/><text x="480" y="541" fill="#111827">Set NextLink from @odata.nextLink</text></g><g stroke="#475569" stroke-width="3"><path d="M480 132v28"/><path d="M480 214v28"/><path d="M480 352v26"/><path d="M480 496v18"/></g><text x="40" y="612" font-family="Segoe UI,Arial" font-size="15" fill="#64748b">Canary: $top=1. Production: restore pagination and controlled page size.</text></svg>
